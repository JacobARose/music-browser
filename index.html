<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive 3D Audio Point Cloud</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; font-family: sans-serif; }
        canvas { display: block; }
        
        /* Overlay to satisfy browser audio autoplay policies */
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.8); display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: white; z-index: 10;
        }
        button {
            padding: 15px 30px; font-size: 1.2rem; cursor: pointer;
            background: #fff; color: #000; border: none; border-radius: 5px;
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <h2>3D Audio Point Cloud</h2>
        <p>Hover over points to trigger sounds.</p>
        <button id="start-btn">Start Experience</button>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // ==========================================
        // 1. DATA LOADER & STATE (CUSTOMIZE HERE)
        // ==========================================
        // In a real app, you would fetch this from a JSON file.
        // We are using 'frequency' for synthesized tones. Replace with 'audioUrl' for real files.
        const pointData = [];
        const pointCount = 500;
        
        for (let i = 0; i < pointCount; i++) {
            pointData.push({
                x: (Math.random() - 0.5) * 50,
                y: (Math.random() - 0.5) * 50,
                z: (Math.random() - 0.5) * 50,
                // Assign a random musical frequency between 200Hz and 800Hz
                frequency: 200 + Math.random() * 600, 
                color: new THREE.Color().setHSL(Math.random(), 0.8, 0.6)
            });
        }

        // ==========================================
        // 2. AUDIO CONTROLLER
        // ==========================================
        let audioCtx;
        let currentOscillator = null;

        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        // DEVELOPER NOTE: Replace this function with one that plays decoded AudioBuffers
        function playTone(frequency) {
            if (!audioCtx) return;
            
            // Stop previous tone to prevent audio chaos
            if (currentOscillator) {
                currentOscillator.stop();
                currentOscillator.disconnect();
            }

            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);
            
            // Simple fade out envelope
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
            currentOscillator = osc;
        }

        // ==========================================
        // 3. SCENE INITIALIZATION
        // ==========================================
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x111111, 0.02);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 40;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // ==========================================
        // 4. POINT CLOUD GENERATOR
        // ==========================================
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(pointCount * 3);
        const colors = new Float32Array(pointCount * 3);

        pointData.forEach((point, i) => {
            positions[i * 3] = point.x;
            positions[i * 3 + 1] = point.y;
            positions[i * 3 + 2] = point.z;

            colors[i * 3] = point.color.r;
            colors[i * 3 + 1] = point.color.g;
            colors[i * 3 + 2] = point.color.b;
        });

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        // CUSTOMIZE HERE: Change point size or texture
        const material = new THREE.PointsMaterial({
            size: 1.5,
            vertexColors: true,
            sizeAttenuation: true
        });

        const pointCloud = new THREE.Points(geometry, material);
        scene.add(pointCloud);

        // Visual feedback for hovering (A larger glowing sphere)
        const highlightMesh = new THREE.Mesh(
            new THREE.SphereGeometry(1.5, 16, 16),
            new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true })
        );
        highlightMesh.visible = false;
        scene.add(highlightMesh);

        // ==========================================
        // 5. INTERACTION ENGINE (RAYCASTING)
        // ==========================================
        const raycaster = new THREE.Raycaster();
        // Make the hit area slightly larger than the visual point
        raycaster.params.Points.threshold = 1.0; 
        
        const mouse = new THREE.Vector2();
        let hoveredIndex = null;

        window.addEventListener('mousemove', (event) => {
            // Normalize mouse coordinates to -1 to +1
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        });

        // ==========================================
        // 6. ANIMATION LOOP
        // ==========================================
        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            // Raycasting logic
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(pointCloud);

            if (intersects.length > 0) {
                // Get the closest intersected point
                const index = intersects[0].index;
                
                if (hoveredIndex !== index) {
                    hoveredIndex = index;
                    
                    // Move highlight mesh to the point's position
                    const point = pointData[index];
                    highlightMesh.position.set(point.x, point.y, point.z);
                    highlightMesh.visible = true;

                    // Trigger Audio
                    playTone(point.frequency);
                }
            } else {
                hoveredIndex = null;
                highlightMesh.visible = false;
            }

            renderer.render(scene, camera);
        }

        // Handle Resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start Button Logic
        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('start-screen').style.display = 'none';
            initAudio();
            animate();
        });

    </script>
</body>
</html>
